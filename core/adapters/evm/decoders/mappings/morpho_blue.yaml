protocol: morpho_blue
chains: [ethereum, base]
# Morpho Blue is a singleton lending pool — one contract per chain handles
# all markets. Each market is keyed by Id (bytes32) = hash(loan, collateral,
# oracle, irm, lltv). The same singleton is at the same address on every
# deployed chain.
#
# token_in / token_out are intentionally not set: the loan asset is keyed
# by market id, not surfaced in the event payload. BD's "first action
# after bridge" uses (protocol, event_type, venue=Morpho-contract).
# Drilling into per-market detail happens via the market_id in extra.
events:
  - name: Supply
    inputs:
      - {name: id,        type: bytes32, indexed: true}
      - {name: caller,    type: address, indexed: true}
      - {name: onBehalf,  type: address, indexed: true}
      - {name: assets,    type: uint256}
      - {name: shares,    type: uint256}
    canonical:
      event_type: lend_deposit
      entity_id:  "{onBehalf}"
      venue:      "{log.address}"
      amount_in:  "{assets}"
      extra:
        market_id: "{id}"
        caller:    "{caller}"
        shares:    "{shares}"

  - name: Withdraw
    inputs:
      - {name: id,        type: bytes32, indexed: true}
      - {name: caller,    type: address}
      - {name: onBehalf,  type: address, indexed: true}
      - {name: receiver,  type: address, indexed: true}
      - {name: assets,    type: uint256}
      - {name: shares,    type: uint256}
    canonical:
      event_type: lend_withdraw
      entity_id:  "{onBehalf}"
      venue:      "{log.address}"
      amount_out: "{assets}"
      extra:
        market_id: "{id}"
        caller:    "{caller}"
        receiver:  "{receiver}"
        shares:    "{shares}"

  - name: Borrow
    inputs:
      - {name: id,        type: bytes32, indexed: true}
      - {name: caller,    type: address}
      - {name: onBehalf,  type: address, indexed: true}
      - {name: receiver,  type: address, indexed: true}
      - {name: assets,    type: uint256}
      - {name: shares,    type: uint256}
    canonical:
      event_type: lend_borrow
      entity_id:  "{onBehalf}"
      venue:      "{log.address}"
      amount_out: "{assets}"
      extra:
        market_id: "{id}"
        caller:    "{caller}"
        receiver:  "{receiver}"
        shares:    "{shares}"

  - name: Repay
    inputs:
      - {name: id,        type: bytes32, indexed: true}
      - {name: caller,    type: address, indexed: true}
      - {name: onBehalf,  type: address, indexed: true}
      - {name: assets,    type: uint256}
      - {name: shares,    type: uint256}
    canonical:
      event_type: lend_repay
      entity_id:  "{onBehalf}"
      venue:      "{log.address}"
      amount_in:  "{assets}"
      extra:
        market_id: "{id}"
        caller:    "{caller}"
        shares:    "{shares}"
