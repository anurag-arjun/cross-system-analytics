protocol: spark
chains: [ethereum]
template: aave_v3
# Spark is an Aave V3 fork operated by MakerDAO. Same Pool ABI (Supply /
# Withdraw / Borrow / Repay), different deployment. Template inheritance
# reuses the aave_v3 events; the Spark Pool address is what differentiates
# them at the (chain, address) resolver level.
