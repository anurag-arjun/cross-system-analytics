name: nexus

# Production stack for shieldtx-vps. Self-contained — does NOT extend
# docker-compose.yml (which is laptop-dev and bundles dagster + observable).
#
# Conventions:
#   * All host-port bindings on 127.0.0.1 only (Cloudflare Tunnel terminates
#     ingress; nothing should be reachable on the public IP).
#   * Host ports shifted off the dev defaults so we don't collide with the
#     existing shieldtx-{ch,pg} containers on the same VPS:
#       ClickHouse HTTP : 18123
#       ClickHouse TCP  : 19000
#       Postgres        : 15434
#       nginx (edge)    : 18080
#   * Cron + backfill run on the host (with the project venv) — only the
#     query-serving stack lives in containers.

services:
  ch:
    image: clickhouse/clickhouse-server:24.3
    container_name: nexus-ch
    restart: unless-stopped
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./core/schemas:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: nexus
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nexus
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pg:
    image: postgres:16
    container_name: nexus-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nexus_ops
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ops"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: nexus-api:latest
    container_name: nexus-api
    restart: unless-stopped
    depends_on:
      ch:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: ch
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nexus
      CLICKHOUSE_DB: nexus
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./ops/nginx/nexus.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro

volumes:
  ch_data:
  pg_data:
