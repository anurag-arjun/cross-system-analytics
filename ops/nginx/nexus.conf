server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # Trust the X-Forwarded-* set by Cloudflare (via the tunnel).
    # Cloudflare's edge connects from a range of IPs we don't enumerate here;
    # the tunnel itself terminates at 127.0.0.1, so logs will show that.

    # ----- API + FastAPI auto-docs -----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ----- Static SPA -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
