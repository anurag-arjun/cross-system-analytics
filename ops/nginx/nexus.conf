# ----- API response cache -----
# BD analytics queries don't need second-by-second freshness — 5-min cached
# responses are fine and protect CH from repeated heavy aggregations during
# dashboard reload bursts. Stored on disk under /var/cache/nginx/api with
# 200MB cap; entries inactive for 30+ min are evicted.
#
# `use_stale` lets nginx serve a cached response while a background
# request refreshes it on miss/timeout — keeps the dashboard responsive
# even when CH is busy with a cron tick.
proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=nexus_api:10m
    max_size=200m
    inactive=30m
    use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # HTTP basic auth gates everything (static SPA + /api + /healthz + /docs).
    # The htpasswd file is mounted from ops/nginx/htpasswd on the host (gitignored).
    auth_basic           "Nexus Analytics";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Trust the X-Forwarded-* set by Cloudflare (via the tunnel).
    # Cloudflare's edge connects from a range of IPs we don't enumerate here;
    # the tunnel itself terminates at 127.0.0.1, so logs will show that.

    # ----- API + FastAPI auto-docs -----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # 5-min cache; serve stale while updating in the background; serve
        # stale on upstream timeout/error so the dashboard never goes dark.
        proxy_cache              nexus_api;
        proxy_cache_valid        200 5m;
        proxy_cache_use_stale    updating timeout error http_502 http_503 http_504;
        proxy_cache_lock         on;
        proxy_cache_background_update on;
        # Default cache key is scheme + host + URI (good for our single-user
        # basic-auth setup — different params hit different keys).
        add_header X-Cache-Status $upstream_cache_status;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ----- Static SPA -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
